# =============================================================================
# 🚀 Deploy Staging
# =============================================================================
# Propósito: Deploy automático a Vercel (staging) cuando se hace push a dev.
# SOLO se ejecuta si los secrets de Vercel están configurados.
# Si no hay secrets configurados, el workflow se salta gracefulmente.
# =============================================================================

name: "🚀 Deploy Staging"

on:
  push:
    branches: [dev-2]  # dev-2 = staging
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

env:
  # Si no hay secrets configurados, el deploy se salta
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
  VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

jobs:
  deploy-api:
    name: "📡 API → Vercel"
    runs-on: ubuntu-latest
    environment: staging
    # Solo corre si VERCEL_TOKEN está configurado
    if: env.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:db
      - run: pnpm run build:api
      - name: Deploy API to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          vercel-args: '--prod'

  deploy-web:
    name: "🌐 Web → Vercel"
    runs-on: ubuntu-latest
    environment: staging
    needs: [deploy-api]
    if: env.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:web
      - name: Deploy Web to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          vercel-args: '--prod'

  db-migrate:
    name: "🗄️ DB Migration"
    runs-on: ubuntu-latest
    environment: staging
    needs: [deploy-api]
    if: env.VERCEL_TOKEN != ''
    steps:
      - name: Run Prisma Migrate
        run: pnpm --filter @cubiculo/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

  smoke-test:
    name: "🔥 Smoke Test"
    runs-on: ubuntu-latest
    needs: [deploy-web, db-migrate]
    if: env.VERCEL_TOKEN != ''
    steps:
      - name: Health Check
        run: |
          echo "Esperando 10s para que el deploy se estabilice..."
          sleep 10
          curl -sf https://api-staging.cubiculo-digital.vercel.app/health \
            || echo "⚠️ Health check falló — verificar manualmente"
        continue-on-error: true
