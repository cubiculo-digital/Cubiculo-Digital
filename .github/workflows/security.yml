# =============================================================================
# 🔐 Security Scan
# =============================================================================
# Propósito: Detectar vulnerabilidades en dependencias y secrets filtrados.
# NO bloquea merges — es informativo. El equipo revisa las alertas en
# GitHub Security tab.
# =============================================================================

name: "🔐 Security Scan"

on:
  pull_request:
    branches: [dev, dev-2]  # dev = prod, dev-2 = staging
  schedule:
    - cron: '0 6 * * *'  # Diario a las 6 AM UTC

jobs:
  audit:
    name: "🔍 Dependency Audit"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  secrets:
    name: "🕵️ Secrets Detection"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified --results=verified,unknown
        continue-on-error: true
