# =============================================================================
# 🔐 Security Scan
# =============================================================================
# Propósito: Detectar vulnerabilidades en dependencias y secrets filtrados.
# NO bloquea merges — es informativo. El equipo revisa las alertas en
# GitHub Security tab.
# =============================================================================

name: "🔐 Security Scan"

on:
  pull_request:
    branches: [main, dev]  # main = prod, dev = staging
  schedule:
    - cron: '0 6 * * *'  # Diario a las 6 AM UTC
  workflow_dispatch:

jobs:
  audit:
    name: "🔍 Dependency Audit"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

# ===========================================================================
# JOB: Secrets Scan (Trufflehog)
# ===========================================================================
  secrets:
    name: "🔒 Secrets Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANTE: Trufflehog necesita escanear todo el historial de commits

      - name: Trufflehog OSS
        # CORRECCIÓN: Se utiliza la sintaxis oficial apuntando a la rama main activa
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --results=verified,unknown

        continue-on-error: true
