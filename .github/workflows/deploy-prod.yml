# =============================================================================
# 🏆 Deploy Production
# =============================================================================
# Propósito: Deploy a producción. SOLO se activa con push a main
# (que ocurre 1 vez: el día 6 cuando mergeamos dev→main).
# Se salta gracefulmente si no hay secrets configurados.
# =============================================================================

name: "🏆 Deploy Production"

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: "🚀 Production Database Sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:db
      - run: pnpm run build

      # Se ejecuta la migración en la base de datos de producción
      - name: DB Migration (Production)
        run: pnpm --filter @cubiculo/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
