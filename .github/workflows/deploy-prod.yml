# =============================================================================
# 🏆 Deploy Production
# =============================================================================
# Propósito: Deploy a producción. SOLO se activa con push a main
# (que ocurre 1 vez: el día 6 cuando mergeamos dev→main).
# Se salta gracefulmente si no hay secrets configurados.
# =============================================================================

name: "🏆 Deploy Production"

on:
  push:
    branches: [dev]  # dev = producción (antes main)
  workflow_dispatch:  # Permite deploy manual de emergencia

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: "🚀 Production Deploy"
    runs-on: ubuntu-latest
    environment: production
    if: env.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:db
      - run: pnpm run build

      - name: Deploy API to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy Web to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          vercel-args: '--prod'

      - name: DB Migration (Production)
        run: pnpm --filter @cubiculo/db exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
